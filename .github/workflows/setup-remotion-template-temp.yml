name: Setup Remotion Template Temporary

on:
  push:
    paths:
      - .github/workflows/setup-remotion-template-temp.yml

permissions:
  contents: write

jobs:
  setup-remotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Remotion dependencies
        run: npm install --save-dev --save-exact remotion@4.0.512 @remotion/cli@4.0.512

      - name: Validate Remotion composition
        run: npm run video:still

      - name: Run application tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(remotion): install runtime dependencies"
          git push origin HEAD:main
