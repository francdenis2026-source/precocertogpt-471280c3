name: SEO Audit

on:
  workflow_run:
    workflows: ["GitHub CI/CD"]
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL pública para auditar'
        required: false
        default: 'https://www.precocerto.live'
        type: string
      mode:
        description: 'Modo da auditoria'
        required: true
        default: 'site'
        type: choice
        options:
          - site
          - fast
          - html
          - full

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run SEO audit
        env:
          SEO_AUDIT_URL: ${{ github.event.inputs.url || 'https://www.precocerto.live' }}
          SEO_AUDIT_MODE: ${{ github.event.inputs.mode || 'site' }}
        run: |
          if [ "$SEO_AUDIT_MODE" = "site" ]; then
            node scripts/run-seo-route-audit.mjs
          elif [ "$SEO_AUDIT_MODE" = "fast" ]; then
            npm run seo:audit:fast
          elif [ "$SEO_AUDIT_MODE" = "html" ]; then
            npm run seo:audit:html
          else
            npm run seo:audit:full
          fi

      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.run_number }}
          path: reports/seo/
          if-no-files-found: ignore
